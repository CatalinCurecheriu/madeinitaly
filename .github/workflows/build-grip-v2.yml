name: Build Grip Challenge V2 APK

on:
  push:
    branches:
      - grip-v2-build-20260811
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package and sign
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ANDROID_JAR="${SDK_ROOT}/platforms/android-35/android.jar"
          BUILD_TOOLS="${SDK_ROOT}/build-tools/35.0.0"
          rm -rf build-grip
          mkdir -p build-grip/classes build-grip/dex build-grip/assets
          cat grip-v2/MainActivity.part* > build-grip/MainActivity.java
          cat > build-grip/assets-parts.sha256 <<'EOF'
          212a6a5429e9bbb2f9b203b4f723392620b423d2e738b5c543c8a9fdd53df606  grip-v2/assetszip.part00
          53aec42ae9a55f7eb34375d42e91ce3d3e6fa9058fdaa372079cbba08fa99ce6  grip-v2/assetszip.part01
          bb286625f5fda6b24709db32b38971a12b4981b88ecaacbb138890efc87eefdf  grip-v2/assetszip.part02
          9b69895991686daa2ba147acf4a27ce2e26e0011c96cef2563a7c01a68e64d11  grip-v2/assetstail.part00
          904e471a38de4f15915a2cc74f2c129c7a2879eff28e4096f756a515b0c4e42c  grip-v2/assetstail.part01
          79f43663fb70d383b2253af9ff4ba34544565a0459ae90322eb2e36ed5d2fd2b  grip-v2/assetfix.part00
          1b20730f1e84df336bdc727ae40ac9da464d2e084a45e2436b121c9514f05551  grip-v2/assetfix.part01
          4e6f60f5671e40922eed9412503e77aba836b838491bbe7e41b7aa856ca9557a  grip-v2/assetfix.part02
          0357009435d65175532c5792c8b9dd8412e8364658a4331554f150e186b1fab6  grip-v2/assetfix.part03
          08747be259d3f793cd34c8acd61857d63b236fb3b2994c8985f00cb951669027  grip-v2/assetfix.part04
          ed310212f8adc6a670a04ed6e25c32c58f08f3f1ad7117f60f09eacf3eab7d1e  grip-v2/assetfix.part05
          312988246cc8447155d7684d5de763e63ffd178e9ead01fa8e1897ba6c048b17  grip-v2/assetstail.part03
          EOF
          sha256sum -c build-grip/assets-parts.sha256
          cat grip-v2/assetszip.part00 grip-v2/assetszip.part01 grip-v2/assetszip.part02 grip-v2/assetstail.part00 grip-v2/assetstail.part01 grip-v2/assetfix.part00 grip-v2/assetfix.part01 grip-v2/assetfix.part02 grip-v2/assetfix.part03 grip-v2/assetfix.part04 grip-v2/assetfix.part05 grip-v2/assetstail.part03 > build-grip/assets.zip.b64
          echo "70b914d9afda7866aebc54eb97fc6c59e876c84ef203f3485b359aa550cbca1b  build-grip/assets.zip.b64" | sha256sum -c -
          base64 -d build-grip/assets.zip.b64 > build-grip/assets.zip
          echo "9a23b241105d058e2da52bd1f92012029ae450c2e88910420b26ff371e90de43  build-grip/assets.zip" | sha256sum -c -
          unzip -q build-grip/assets.zip -d build-grip/assets-raw
          cp build-grip/assets-raw/product_tiny.jpg build-grip/assets/product.jpg
          for i in 1 2 3 4 5 6 7 8; do cp "build-grip/assets-raw/avatar${i}_tiny.jpg" "build-grip/assets/avatar${i}.png"; done
          javac -encoding UTF-8 -source 8 -target 8 -classpath "${ANDROID_JAR}" -d build-grip/classes build-grip/MainActivity.java
          "${BUILD_TOOLS}/d8" --lib "${ANDROID_JAR}" --min-api 26 --output build-grip/dex $(find build-grip/classes -name '*.class' -type f)
          "${BUILD_TOOLS}/aapt2" link -o build-grip/app-unsigned.apk --manifest grip-v2/AndroidManifest.xml -I "${ANDROID_JAR}" --min-sdk-version 26 --target-sdk-version 34 --version-code 2 --version-name 2.0
          ( cd build-grip/dex && zip -q -u ../app-unsigned.apk classes.dex )
          ( cd build-grip && zip -q -r -u app-unsigned.apk assets )
          keytool -genkeypair -keystore build-grip/grip-v2-release.jks -storepass gripchallenge -keypass gripchallenge -alias gripchallenge -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Grip Challenge V2, OU=Office Challenge, O=Grip Challenge, L=Torino, ST=Piemonte, C=IT"
          "${BUILD_TOOLS}/zipalign" -f -p 4 build-grip/app-unsigned.apk build-grip/app-aligned.apk
          "${BUILD_TOOLS}/apksigner" sign --ks build-grip/grip-v2-release.jks --ks-pass pass:gripchallenge --key-pass pass:gripchallenge --out build-grip/Grip-Challenge-40KG-V2.apk build-grip/app-aligned.apk
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs build-grip/Grip-Challenge-40KG-V2.apk
          sha256sum build-grip/Grip-Challenge-40KG-V2.apk | tee build-grip/Grip-Challenge-40KG-V2.apk.sha256
      - name: Smoke test install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r build-grip/Grip-Challenge-40KG-V2.apk
            adb shell am force-stop it.gripchallenge.office.v2
            adb shell am start -W -n it.gripchallenge.office.v2/.MainActivity | tee build-grip/launch-result.txt
            grep -q "Status: ok" build-grip/launch-result.txt
            sleep 3
            adb shell pidof it.gripchallenge.office.v2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grip-challenge-v2-tested
          path: |
            build-grip/Grip-Challenge-40KG-V2.apk
            build-grip/Grip-Challenge-40KG-V2.apk.sha256
            build-grip/launch-result.txt
          if-no-files-found: error
          retention-days: 7
